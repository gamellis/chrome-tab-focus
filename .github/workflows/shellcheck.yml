name: shellcheck

on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --shell=sh ./*.sh

  # Tab focus and carve-outs: need osascript, not Chrome.
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./test-tab-focus.sh
      - run: ./test-carve-outs.sh
